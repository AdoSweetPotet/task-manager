<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>Task Manager</h1>
                <p>Manage your daily tasks in one place.</p>
            </div>

            <button class="add-button" onclick="openTaskForm()">
                + Add Task
            </button>
        </header>

        <!-- Existing Tasks Section -->
        <div class="task-section">

            <h2>My Tasks</h2>

            <div id="empty-state">
                <h3>No tasks yet</h3>
                <p>Click the Add Task button to create your first task.</p>
            </div>

            <!-- Member 2's READ feature will display tasks here -->
            <div id="task-list"></div>

        </div>

    </div>


    <!-- Add Task Popup -->
    <div id="taskModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2>Add New Task</h2>

                <button class="close-button" onclick="closeTaskForm()">
                    &times;
                </button>
            </div>

            <label for="title">Task Title</label>
            <input type="text" id="title" placeholder="Enter task title">

            <label for="description">Description</label>
            <textarea id="description" placeholder="Enter task description"></textarea>

            <label for="priority">Priority</label>
            <select id="priority">
                <option value="">Select priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <label for="deadline">Deadline</label>
            <input type="date" id="deadline">

            <div class="form-buttons">
                <button class="cancel-button" onclick="closeTaskForm()">
                    Cancel
                </button>

                <button class="submit-button" onclick="addTask()">
                    Add Task
                </button>
            </div>

        </div>

    </div>

    <script src="js/add-task.js"></script>
    <h1>Welcome to Task Manager</h1>
    <p>Manage your daily tasks in one place.</p>

    <hr>

    <!-- Update Task Section -->
    <h2>Update Task</h2>

    <form id="updateTaskForm">

        <label for="updateId">Task ID:</label>
        <input type="number" id="updateId" min="1" required>

        <label for="title">Task Title:</label>
        <input type="text" id="title" required>

        <label for="description">Description:</label>
        <textarea id="description" required></textarea>

        <label for="priority">Priority:</label>
        <select id="priority" required>
            <option value="">Select Priority</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>

        <label for="status">Status:</label>
        <select id="status" required>
            <option value="">Select Status</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>

        <!-- Sorting -->
        <select id="sortOrder">
            <option value="">Default Order</option>
            <option value="asc">Deadline: Earliest First</option>
            <option value="desc">Deadline: Latest First</option>
        </select>
    </div>

    <button id="resetFilters">Reset Filters</button>

    <!-- Results message -->
    <p id="resultMessage"></p>

    <!-- Task display -->
    <div id="taskList" class="task-list"></div>
</section>

<script src="js/read-task.js"></script>
        <label for="deadline">Deadline:</label>
        <input type="date" id="deadline" required>

        <button type="button" onclick="updateTask(document.getElementById('updateId').value)">
            Update Task
        </button>

    </form>

    <p id="updateMessage"></p>

    <hr>

    <!-- Delete Task Section -->
    <h2>Delete Task</h2>

    <form id="deleteTaskForm">

        <label for="deleteId">Task ID:</label>
        <input type="number" id="deleteId" min="1" required>

        <button type="button" onclick="deleteTask(document.getElementById('deleteId').value)">
            Delete Task
        </button>

    </form>

    <p id="deleteMessage"></p>

    <!-- JavaScript Files -->
    <script src="js/update-task.js"></script>
    <script src="js/delete-task.js"></script>

</body>
</html>
